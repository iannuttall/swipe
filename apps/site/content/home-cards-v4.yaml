- id: audience-language
  group: message
  type: message
  sender: Audience research
  text: |
    People rarely say "increase productivity."
    They say "stop losing Friday to admin."

    I found 14 more phrases worth stealing.

- id: pricing-watcher
  group: message
  type: message
  sender: Pricing watcher
  text: |
    Acme removed the free plan.
    Team pricing moved from £12 to £18.
    Their annual discount stayed the same.

- id: books-check
  group: message
  type: message
  sender: Books check
  time: "2:41 AM"
  text: |
    Reconciled the month.
    One duplicate charge, one missing receipt.
    Flagged both — go back to sleep.

- id: monday-brief
  group: message
  type: message
  sender: Monday brief
  text: |
    Revenue is on plan.
    Two projects are blocked by the same approval.
    Three invoices are now over 30 days late.

- id: prototype-test
  group: message
  type: message
  sender: Prototype test
  text: |
    4 of 5 people missed the export button.
    All five understood the new filter.
    The empty state needs one real example.

- id: churn-watch
  group: message
  type: message
  sender: Churn watch
  text: |
    6 of this month's 9 cancellations
    stopped using the same feature
    three weeks before they left.

- id: mention-watcher
  group: message
  type: message
  sender: Mention watcher
  text: |
    Your product came up in 3 podcasts this week.
    Two praised the onboarding.
    One host couldn't find your pricing page.

- id: meeting-prep
  group: message
  type: message
  sender: Meeting prep
  text: |
    You meet Dana at 2pm. Since your last call:
    they raised a Series A, changed pricing,
    and your proposal went unanswered.

# ── plan mode ─────────────────────────────────────────────────

- id: plan-invoice-chase
  group: plan
  type: plan
  question: How should I chase this late invoice?
  selected: 0
  options:
    - label: friendly nudge
      desc: third reminder, keep it warm
    - label: firm reminder
      desc: copy in their accounts team
    - label: pick up the phone
      desc: it's been 45 days

- id: plan-newsletter-angle
  group: plan
  type: plan
  question: What's the newsletter angle?
  selected: 1
  options:
    - label: behind-the-scenes
      desc: what you're actually building
    - label: curated finds
      desc: the best stuff, before it's popular
    - label: tutorials
      desc: step-by-step guides
    - label: hot takes
      desc: opinions on AI trends
