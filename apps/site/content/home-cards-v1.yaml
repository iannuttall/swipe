    RUN corepack enable

    FROM base AS build
    WORKDIR /app
    COPY . .
    RUN pnpm install --frozen-lockfile
    RUN pnpm build

    FROM base AS runtime
    COPY --from=build /app/.output .
    CMD ["node", "server/index.mjs"]

