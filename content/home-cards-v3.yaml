# ── terminal ──────────────────────────────────────────────────

- id: ralph-loop
  group: terminal
  type: terminal
  title: agent loop
  text: |
    $ agent run --plan
    plans/faq-miner.md

    iteration 1 of 25
    -> pull comments from niche videos
    -> cluster repeated questions
    -> draft an "audience asks" brief

- id: churn-risk-terminal
  group: terminal
  type: terminal
  title: claude code
  text: |
    $ claude -p "read this quarter's
    support tickets, rank churn risks"

    Reading 1,204 tickets...
    ✓ 7 recurring problems
    ✓ 3 accounts at risk
    ✓ saved to reports/q3-churn.md

- id: monday-cron
  group: terminal
  type: terminal
  title: cron
  text: |
