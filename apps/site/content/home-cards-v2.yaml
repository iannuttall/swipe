- id: one-word-domain-finder
  group: build
  type: field-note
  eyebrow: Built this week
  title: A one-word domain finder
  text: Give it a rough idea. It expands the concept, checks hundreds of extensions and ranks the names worth registering.
  result: 300 open tabs became one shortlist.

- id: agent-publish-button
  group: build
  type: field-note
  eyebrow: Tiny idea, big upgrade
  title: Give your agent a publish button
  text: Let an AI agent turn its work into a report, dashboard or one-pager with a real shareable link.
  result: Publish the next research task instead of pasting it into a doc.

- id: screenshot-to-site
  group: build
  type: before-after
  title: Rebuild a page from a screenshot
  before: A flat image with no editable parts
  after: A responsive page you can change and ship

- id: personal-command-centre
  group: build
  type: result
  app: localhost/dashboard
  title: Your week, in one view
  detail: Calendar, tasks, unread messages and the numbers you care about, pulled together by an agent.
  status: refreshed 2 min ago

- id: talk-a-prototype-into-life
  group: build
  type: chat
  messages:
    - role: user
      text: |
        I need a tiny tool that sorts this CSV and gives each lead a score.
    - role: ai
      text: |
        Done. Drop in the file, tune the scoring rules and export the shortlist.

- id: searchable-company-brain
  group: build
  type: workflow
  title: Make your files searchable
  input: A folder full of docs, calls and PDFs
  steps:
    - Extract and label the useful parts
    - Keep a link back to every source
    - Ask questions in normal language
  output: Answers with receipts, not guesses

- id: spreadsheet-to-app
  group: build
  type: result
  app: stockroom.tools
  title: The spreadsheet became an app
  detail: The same data, now with a clean form, search, permissions and automatic reminders.
  status: shared with 8 people

- id: logo-png-to-svg
  group: create
  type: skill
  title: Turn an AI logo into a real SVG
  giveIt: A fuzzy PNG from ChatGPT or another image tool
  learns: How to rebuild the shapes, paths and lettering, then compare its work with the original
  result: A crisp, editable logo at any size

- id: train-your-writing-voice
  group: create
  type: skill
  title: Teach an agent how you write
  giveIt: 30 to 100 things you have written
  learns: Your phrases, rhythm, word choice and sentence patterns
  result: Writing rules the agent can use again

- id: logo-to-brand-kit
  group: create
  type: before-after
  title: Grow one logo into a brand kit
  before: A single logo file sitting in Downloads
  after: Colours, type, icons, social cards and simple usage rules

- id: podcast-to-clips
  group: create
  type: result
  app: clip-maker
  title: 47 minutes became six useful clips
  detail: The best moments were found, reframed, captioned and given titles without scrubbing the timeline.
  status: ready to review

- id: sketch-to-product-shot
  group: create
  type: swipe
  title: Turn a rough sketch into a product shot
  text: Keep the shape of your idea, then ask AI to explore materials, lighting and real-world settings.
  tryThis: photograph the sketch beside one reference image

- id: restyle-a-photo
  group: create
  type: chat
  messages:
    - role: user
      text: |
        Keep the room exactly as it is. Show me warmer paint, better lighting and less clutter.
    - role: ai
      text: |
        Here are three versions. I kept the windows, furniture and proportions unchanged.

- id: build-your-own-font
  group: create
  type: swipe
  title: Make a font from your handwriting
  text: Write one alphabet on paper, photograph it and use an agent to clean, space and package the characters.
  tryThis: start with a title-only font, not every symbol

- id: reviews-to-ads
  group: marketing
  type: skill
  title: Turn reviews into better ads
  giveIt: Your best customer reviews
  learns: The phrases people repeat, the problems behind them and the result they want
  result: Ad copy built from what customers already say

- id: webinar-to-campaign
  group: marketing
  type: before-after
  title: Reuse the webinar properly
  before: One recording that disappears after the event
  after: An email, clips, a guide, social posts and a follow-up sequence

- id: plain-english-copy-critic
  group: marketing
  type: prompt
  title: Find the vague bits
  prompt: Read this page like a sceptical customer. Mark every line that sounds impressive but does not say what changes for me.
  result: A sharper page built around the actual outcome

- id: brand-voice-campaign
  group: marketing
  type: result
  app: campaign-draft
  title: One idea, written five ways
  detail: Landing page, launch email, ad, sales note and social post, all using the same voice and facts.
  status: voice check passed

- id: watch-competitor-pages
  group: marketing
  type: swipe
  title: Watch competitor pages for real changes
  text: Have an agent visit the same pages each week and explain only what changed in the offer, proof or pricing.
  tryThis: watch three pricing pages every Monday

- id: audience-language-report
  group: marketing
  type: message
  sender: Audience research
  text: |
    People rarely say "increase productivity."
    They say "stop losing Friday to admin."

    I found 14 more phrases worth stealing.

- id: old-content-new-traffic
  group: marketing
  type: workflow
  title: Find the posts worth updating
  input: Your analytics and old articles
  steps:
    - Spot pages that are slowly slipping
    - Compare them with current search results
    - Suggest the smallest useful update
  output: A ranked refresh list, not a new content treadmill

- id: interviews-to-themes
  group: product
  type: workflow
  title: Find patterns across user interviews
  input: Transcripts from recent calls
  steps:
    - Tag problems in the customer's words
    - Count repeated moments and workarounds
    - Link every theme to the source calls
  output: A short evidence-backed product brief

- id: sketch-to-prototype
  group: product
  type: before-after
  title: Test the idea before the backlog
  before: A whiteboard sketch and a long meeting
  after: A clickable flow that five users can try today

- id: feedback-to-roadmap
  group: product
  type: result
  app: feedback-board
  title: 286 requests, grouped by real need
  detail: Duplicates merged, themes named and every insight linked back to the original customer.
  status: 7 themes need review

- id: release-notes-from-work
  group: product
  type: prompt
  title: Write release notes people understand
  prompt: Read the shipped tickets. Group them by customer outcome, remove internal project names and explain what changed in plain English.
  result: Release notes worth reading

- id: app-reviews-to-spec
  group: product
  type: workflow
  title: Mine app reviews for product gaps
  input: Reviews for your app and its alternatives
  steps:
    - Separate bugs from missing outcomes
    - Find complaints shared across products
    - Turn the strongest gap into a small spec
  output: One testable feature idea with evidence

- id: pricing-page-changed
  group: product
  type: message
  sender: Pricing watcher
  text: |
    Acme removed the free plan.
    Team pricing moved from £12 to £18.
    Their annual discount stayed the same.

- id: prototype-test-recap
  group: product
  type: message
  sender: Prototype test
  text: |
    4 of 5 people missed the export button.
    All five understood the new filter.
    The empty state needs one real example.

- id: sales-call-follow-up
  group: business
  type: skill
  title: Finish the admin after every sales call
  giveIt: A call recording and access to the CRM
  learns: Where you keep needs, objections, next steps and the wording you use in follow-ups
  result: A clean record and an email ready to send

- id: invoice-cleanup
  group: business
  type: before-after
  title: Clean up a month of invoices
  before: PDFs, forwarded emails and mystery filenames
  after: One checked spreadsheet with duplicates and missing VAT flagged

- id: notes-to-proposal
  group: business
  type: prompt
  title: Turn discovery notes into a proposal
  prompt: Draft a short proposal from these notes. Do not invent deliverables, dates or certainty. Leave a clear question wherever the scope is still fuzzy.
  result: A usable first draft with the gaps left visible

- id: support-weekly-report
  group: business
  type: result
  app: support pulse
  title: What customers struggled with this week
  detail: The recurring problems, emerging bugs and replies that actually solved them.
  status: 312 tickets analysed

- id: compare-contracts
  group: business
  type: swipe
  title: Compare the new contract with the old one
  text: Ask AI to show changed obligations, dates and costs in a table, with a link to every clause.
  tryThis: treat the result as a review aid, not legal advice

- id: weekly-ops-brief
  group: business
  type: message
  sender: Monday brief
  text: |
    Revenue is on plan.
    Two projects are blocked by the same approval.
    Three invoices are now over 30 days late.

- id: kill-the-meeting
  group: business
  type: before-after
  title: Replace the status meeting
  before: Six people reading their updates aloud
  after: One agent-written brief with decisions and blockers highlighted

- id: pdf-to-cited-brief
  group: research
  type: workflow
  title: Turn a dense PDF into a useful brief
  input: A report you do not have an afternoon to read
  steps:
    - Extract the claims that matter to you
    - Check them against the tables and notes
    - Add page links for every important point
  output: A brief you can verify in minutes

- id: searchable-bookmarks
  group: research
  type: result
  app: saved-stuff
  title: Your bookmarks can answer questions now
  detail: Articles, videos and notes are indexed by meaning, with the original source one click away.
  status: 1,842 items searchable

- id: spreadsheet-patterns
  group: research
  type: prompt
  title: Find the strange thing in this spreadsheet
  prompt: Show me the pattern first. Then explain it in plain English and list the rows that prove it.
  result: The odd bit, with receipts

- id: saved-tabs-to-market-map
  group: research
  type: before-after
  title: Map a market from your open tabs
  before: Twenty-seven companies and no clear picture
  after: Categories, overlaps, gaps and a short note on every company

- id: comments-to-faq
  group: research
  type: workflow
  title: Find questions hiding in comments
  input: Comments from useful videos, forums or communities
  steps:
    - Pull out genuine unanswered questions
    - Merge repeated versions of the same need
    - Rank them by frequency and urgency
  output: A customer-led FAQ or content plan

- id: claim-checker
  group: research
  type: prompt
  title: Make AI argue with its own research
  prompt: Build the strongest case against your conclusion. Show weak evidence, missing sources and what would change your mind.
  result: A conclusion that survives a second pass

- id: topic-brief-delivered
  group: research
  type: message
  sender: Research agent
  text: |
    I read 18 sources and rejected five weak ones.
    The brief has four findings, two disagreements
    and links to the original evidence.

- id: redesign-my-room
  group: everyday
  type: chat
  messages:
    - role: user
      text: |
        Redesign this room for under £500. Keep the sofa and do not move the radiator.
    - role: ai
      text: |
        I made three options and priced the exact changes. The cheapest is £286.

- id: trip-from-saved-places
  group: everyday
  type: workflow
  title: Plan a trip from places you already saved
  input: Pins, screenshots and recommendations from friends
  steps:
    - Put every place on one map
    - Group nearby stops into sensible days
    - Check opening times and travel gaps
  output: A flexible plan built around what you like

- id: fridge-photo-dinner
  group: everyday
  type: chat
  messages:
    - role: user
      text: |
        This is what is in my fridge. What can I cook in 25 minutes without buying twelve more things?
    - role: ai
      text: |
        Make the crispy chickpea bowls. You only need one lemon. Here is the five-step version.

- id: voice-notes-to-journal
  group: everyday
  type: result
  app: weeknotes
  title: Seven messy voice notes became one journal entry
  detail: Repeated thoughts were merged, names checked and the original recordings kept beside the draft.
  status: private draft

- id: course-material-to-tutor
  group: everyday
  type: before-after
  title: Build a tutor from your course material
  before: Slides, notes and a reading list you keep rereading
  after: Short explanations, practice questions and feedback tied to the source

- id: searchable-family-archive
  group: everyday
  type: skill
  title: Make old family photos searchable
  giveIt: Scanned albums and boxes of unlabeled pictures
  learns: How to group faces, places and decades while keeping family names and stories attached
  result: An archive your family can search and add to

- id: gift-finder
  group: everyday
  type: prompt
  title: Find a gift from the clues you already have
  prompt: Use these messages, hobbies and my budget. Give me five thoughtful ideas that cannot be bought on Amazon.
  result: A gift that feels like you paid attention
