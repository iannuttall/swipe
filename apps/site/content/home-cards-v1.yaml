# ── cli cards (agent + diff) ──────────────────────────────────

- id: cli-hero
  type: cli
  group: claude-cli
  tool: claude --dangerously-skip-permissions
  command: make the hero copy more direct
  diff: |
    src/components/Hero.tsx
    -  <h1>Revolutionize your workflow</h1>
    +  <h1>Ship faster. Start now.</h1>

- id: cli-darkmode
  type: cli
  group: codex-cli
  tool: codex --yolo
  command: add dark mode support
  diff: |
    src/styles/app.css
    + @media (prefers-color-scheme: dark) {
    +   :root { --bg: #0f1115; --fg: #e4e4e7 }
    + }

- id: cli-index
  type: cli
  group: claude-cli
  tool: claude --dangerously-skip-permissions
  command: the posts query is slow, fix it
  diff: |
    src/db/schema.ts
    + .index('idx_posts_created',
    +   posts.createdAt.desc()
    + )

- id: cli-auth
  type: cli
  group: claude-cli
  tool: claude --dangerously-skip-permissions
  command: add rate limiting to the auth routes
  diff: |
    src/routes/api/auth.ts
    + const limiter = rateLimit({
    +   window: '15m', max: 5
    + })
    + app.use('/api/auth', limiter)

- id: cli-meta
  type: cli
  group: codex-cli
  tool: codex --yolo
  command: |
    every route needs proper meta tags.
    use the buildMeta helper
  diff: |
    src/routes/index.tsx
    -  head: () => ({ title: 'Home' }),
    +  head: () => buildMeta({
    +    title: 'ian.is',
    +    description: 'practical AI',
    +    path: '/',
    +  }),

- id: cli-cache
  type: cli
  group: claude-cli
  tool: claude --dangerously-skip-permissions
  command: add redis caching to the hot paths
  diff: |
    src/lib/cache.ts
    + const cached = await redis.get(key)
    + if (cached) return JSON.parse(cached)
      const data = await db.query(...)
    + await redis.set(key, JSON.stringify(data),
    +   { ex: 300 })

- id: cli-aria
  type: cli
  group: claude-cli
  tool: claude --dangerously-skip-permissions
  command: the modal needs aria attributes
  diff: |
    src/components/Modal.tsx
    -  <div className="modal">
    +  <div role="dialog" aria-modal="true"
    +    aria-labelledby="modal-title">

- id: cli-env
  type: cli
  group: codex-cli
  tool: codex --yolo
  command: validate env vars at startup with zod
  diff: |
    src/lib/env.ts
    - const db = process.env.DATABASE_URL
    + const env = z.object({
    +   DATABASE_URL: z.string().url(),
    +   SESSION_SECRET: z.string().min(32),
    + }).parse(process.env)

