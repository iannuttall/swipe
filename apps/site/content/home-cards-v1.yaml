- id: perf-chat
  type: chat
  group: chat
  messages:
    - role: user
      text: my site is DOWN. it loads for like 120 seconds and then dies. WHY?
    - role: ai
      text: |
        checking... your TTFB is 48 seconds.

        you're doing 6 sequential database queries on every page load and one of them is a full table scan on 2M rows.
    - role: user
      text: oh god. how do I fix it?
    - role: ai
      text: |
        add an index on created_at — that's the big one.

        then batch your queries with Promise.all instead of awaiting each one. add Redis caching for the hot paths.

        you'll go from 48s to under 200ms.
    - role: user
      text: can you just do it for me?
    - role: ai
      text: "on it."

