- id: claudemd-full
  type: file
  group: claude-md
  filename: CLAUDE.md
  text: |
    # ian.is

    ## Stack
    - TanStack Start (SSR) + React 19
    - Tailwind CSS v4 + shadcn/ui
    - PostgreSQL + Drizzle ORM
    - Better Auth (GitHub OAuth)
    - Docker on Hetzner VPS

    ## Rules
    - Always use pnpm, never npm
    - Prefer editing over creating files
    - Don't add features beyond what's asked

- id: agents-md
  type: file
  group: agents-md
  filename: AGENTS.md
  text: |
    # Agent Rules

    - Read the full file before editing
    - Never commit secrets or .env files
    - Run tests after every change
    - Prefer small, focused commits
    - Ask before destructive operations
    - Don't over-engineer solutions

- id: agents-md-full
  type: file
  group: agents-md
  filename: AGENTS.md
  text: |
    # Agent Guidelines

    ## Code
    - Read before you write
    - Prefer editing over creating
    - Keep changes minimal and focused
    - Run the test suite after changes

    ## Git
    - Conventional commits only
    - Never force push to main
    - Never skip pre-commit hooks

    ## Communication
    - Be concise, not verbose
    - Show what you did, not what you plan
    - Flag risks before acting

- id: skill-keep-md
  type: file
  group: skill
  filename: SKILL.md
  text: |
    ---
    name: keep-markdown
    description: Search and retrieve saved
      web content as clean Markdown
      from the keep.md API.
    ---

    1. Install the CLI with
       `npm i -g keep-markdown`
    2. Sign up at keep.md and
       create an API key.
    3. Auth with `keep key <your-token>`
    4. Use `keep help` to learn how
       to use it

- id: skill-commit
  type: file
  group: skill
  filename: SKILL.md
  text: |
    ---
    name: commit
    description: Write conventional commit
      messages with type, scope,
      and subject line.
    ---

    1. Stage your changes with `git add`
    2. Run `/commit` to generate a message
    3. Format: type(scope): subject
    4. Types: feat, fix, refactor, perf,
       test, ci, docs, chore

- id: skill-deploy
  type: file
  group: skill
  filename: SKILL.md
  text: |
    ---
    name: deploy
    description: Deploy to production via
      Docker on Hetzner VPS with
      health check verification.
    ---

    1. Run the full test suite
    2. Build the Docker image
    3. Push to the container registry
    4. SSH into the server
    5. Pull and restart containers
    6. Verify health checks pass

- id: skill-scrape
  type: file
  group: skill
  filename: SKILL.md
  text: |
    ---
    name: scrape
    description: Scrape a URL and return
      clean structured content using
      Firecrawl or Jina Reader.
    ---

    1. Pass the target URL
    2. Choose format: markdown or JSON
    3. Optionally filter by CSS selector
    4. Returns clean content with
       metadata stripped

- id: skill-newsletter
